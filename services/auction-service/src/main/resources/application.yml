server:
  port: ${PORT:5000}
  servlet:
    session:
      cookie:
        name: gearbids.sid
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        max-age: ${COOKIE_MAX_AGE:86400s}

spring:
  application:
    name: gearbids-auction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gearbids}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000

management:
  endpoints:
    web:
      exposure:
        # SEC-15: Limit publicly exposed Actuator endpoints to health and info
        include: health,info
  endpoint:
    health:
      # SEC-15: Restrict detailed component/database health probes
      show-details: when_authorized

info:
  app:
    name: ${spring.application.name}
    version: ${app.version}
    release-tag: ${app.release-tag}
    git-commit: ${app.git-commit}

app:
  version: ${APP_VERSION:1.0.0}
  release-tag: ${RELEASE_TAG:v1.0.0}
  git-commit: ${GIT_COMMIT:unknown}
  services:
    notifications-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:5001}
    inspections-url: ${INSPECTIONS_SERVICE_URL:http://localhost:5002}
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:gearbids-internal-service-token-dev}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
